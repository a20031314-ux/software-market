<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동호회·크루 운영 모듈 — 앱공방</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#17120f; --surface:#221b16; --surface2:#2b221c; --line:#3b312a;
    --ink:#f4eee8; --muted:#ab9e92; --accent:#f08a4b; --accent-ink:#1d1410;
  }
  *{margin:0;box-sizing:border-box}
  body{background:var(--night);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
  a{color:inherit}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:rgba(23,18,15,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
  .logo{font-weight:800;text-decoration:none}.logo b{color:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;font-size:15px;min-height:44px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .hero{padding:44px 0 8px}
  .eyebrow{color:var(--muted);font-size:14px}
  h1{font-size:34px;letter-spacing:-1px;line-height:1.3;margin:6px 0 12px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.jump{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
  nav.jump a{text-decoration:none;font-size:14px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
  nav.jump a.rec{border-color:var(--accent);color:var(--accent)}
  .group{margin-top:56px}
  .group > h2{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:6px}
  .module{padding:28px 0 36px;border-top:1px solid var(--line)}
  .mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .mhead h3{font-size:26px;letter-spacing:-.6px;line-height:1.3}
  .mhead p{color:var(--muted);font-size:15px;margin-top:4px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
  .tag.rec{background:var(--accent);color:var(--accent-ink)}
  .scenes{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,320px)),1fr))}
  .scenes.phone{--min:200px}
  .scene{margin:0;display:flex;flex-direction:column;gap:10px}
  .scene button{all:unset;cursor:zoom-in;display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
  .scene button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .scene img{display:block;width:100%;height:auto}
  .scenes.phone img{aspect-ratio:390/700;object-fit:contain;object-position:top;background:var(--surface)}
  .scene figcaption{font-size:14px;line-height:1.5}
  .scene figcaption b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--accent);font-size:12px;margin-right:6px}
  .scene figcaption span{color:var(--muted)}
  .cta{margin:64px 0 40px;padding:28px;border-radius:18px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .cta h2{font-size:22px}.cta p{color:var(--muted);font-size:15px}
  footer{color:var(--muted);font-size:13px;padding:0 0 40px}
  dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1440px);max-height:94vh}
  dialog::backdrop{background:rgba(10,8,6,.88)}
  dialog img{display:block;max-width:100%;max-height:88vh;border-radius:12px}
  dialog p{color:var(--ink);text-align:center;font-size:15px;margin-top:10px}
  dialog .close{position:fixed;top:14px;right:14px}
  @media (max-width:640px){h1{font-size:26px}.mhead h3{font-size:22px}}
  /* ── 첫 화면: 무엇인지 한눈에(실제 화면 두 장 겹쳐서) ── */
  .hero2{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center;padding:56px 0 32px;border-bottom:1px solid var(--line)}
  .hero2 h1{font-size:42px;letter-spacing:-1.4px;line-height:1.25;margin:10px 0 14px}
  .hero2 .lead{color:var(--muted);font-size:17px;max-width:30em}
  .points{list-style:none;padding:0;display:grid;gap:12px;margin:26px 0 0}
  .points li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:16px}
  .points li i{font-style:normal;width:28px;height:28px;border-radius:9px;background:var(--surface2);color:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
  .points li span{color:var(--muted)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
  .shots{position:relative;padding:18px 0 0}
  .shots .pc{width:86%;margin-right:auto;display:block;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .shots .mobile{position:absolute;right:0;bottom:-24px;width:34%;border-radius:24px;border:6px solid #0b0d0d;box-shadow:0 24px 60px rgba(0,0,0,.6);background:#0b0d0d}
  .shots .label{position:absolute;font-size:13px;font-weight:700;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
  .shots .label.l2{left:3%;bottom:-40px}
  .shots .label.l1{right:4%;bottom:-40px}
  @media (max-width:900px){.hero2{grid-template-columns:1fr;gap:28px;padding:32px 0 56px}.hero2 h1{font-size:30px}}
  /* ── 쌓이는 데이터: 장면마다 큰 화면 하나 + 실제 숫자 ── */
  .values{padding:24px 0 8px}
  .value{padding:64px 0;border-bottom:1px solid var(--line)}
  .value.phone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
  .vtext{margin-bottom:24px}
  .vtext .who{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
  .vtext h2{font-size:34px;letter-spacing:-1px;line-height:1.3}
  .vtext .more{all:unset;cursor:pointer;display:inline-block;margin-top:12px;font-size:14px;color:var(--muted)}
  .vtext .more:hover{color:var(--accent)}
  .vshots{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .vshot.full{grid-column:1/-1}
  .vshots{align-items:start}
  .vshots.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .soon{border:1px dashed var(--line);border-radius:14px;padding:18px 20px;color:var(--muted);font-size:15px}
  .soon ol{margin:8px 0 0 18px;color:var(--ink)}
  .tag.soon-tag{background:transparent;border:1px dashed var(--line)}
  .value.phone .vshots{grid-template-columns:1fr;justify-items:center}
  .value.phone .vshot{max-width:360px;border-radius:24px}
  .textlink{color:var(--muted);font-size:15px;text-decoration:none;align-self:center}
  .textlink:hover{color:var(--ink)}
  .note{position:absolute;transform:translateY(-50%);background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;line-height:1.3;padding:5px 11px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}
  .note.top{left:10px;top:10px;transform:none;background:rgba(23,18,15,.85);color:var(--ink);border:1px solid var(--line);font-weight:500}
  .scene button{position:relative}
  .vshot{all:unset;position:relative;cursor:zoom-in;display:block;width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .vshot img{display:block;width:100%;height:auto}
  .vshot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (max-width:560px){.note{font-size:11px;padding:3px 8px}}
  @media (max-width:860px){.value.phone{grid-template-columns:1fr}.vshots,.vshots.n3{grid-template-columns:1fr}.vtext h2{font-size:26px}}
  .catalog{padding:40px 0 0}
  .catalog > details > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 4px;border-top:1px solid var(--line)}
  .catalog > details > summary::-webkit-details-marker{display:none}
  .catalog > details > summary h2{font-size:22px}
  .catalog > details > summary .open{font-size:14px;color:var(--accent)}
  .catalog .gtitle{font-size:14px;color:var(--muted);margin:24px 4px 4px}
  details.mod{scroll-margin-top:64px}
  details.mod{scroll-margin-top:64px}
  details.mod{border-top:1px solid var(--line)}
  details.mod:last-of-type{border-bottom:1px solid var(--line)}
  details.mod > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:20px 4px}
  details.mod > summary::-webkit-details-marker{display:none}
  details.mod > summary h3{font-size:21px;letter-spacing:-.4px;line-height:1.35}
  details.mod > summary p{color:var(--muted);font-size:15px}
  details.mod > summary .open{font-size:14px;color:var(--accent);white-space:nowrap}
  details.mod[open] > summary .open::after{content:" ▲"}
  details.mod:not([open]) > summary .open::after{content:" ▼"}
  details.mod .body{padding:4px 4px 32px}
  details.mod .body .foot{display:flex;justify-content:flex-end;margin-top:16px}
  /* 이름표가 화면 내용을 가리지 않게 — 이름표 자리를 화면 위에 따로 */
  .vshots .vshot,.scene button:has(.note){padding-top:42px;background:var(--surface)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/system">앱<b>공방</b></a>
  <a class="btn" href="/system#contact">문의하기</a>
</div></header>

<main class="wrap">
  <section class="hero2">
    <div>
      <p class="eyebrow">동호회 · 크루 · 소모임</p>
      <h1>단톡방에 흩어지던 모임을<br>우리 이름의 앱 하나로</h1>
      <p class="lead">가입·정모·공지가 한곳에 모여 운영진 일이 줄어요.</p>
      <div class="actions">
        <a class="btn" href="/system#contact">문의하기</a>
        <a class="textlink" href="#values">어떻게 달라지나요 ↓</a>
      </div>
    </div>
    <div class="shots" aria-label="실제 화면(가상 데이터)">
      <img class="pc" src="/img/club/st-a2.jpg" alt="운영진: 가입 신청 수락">
      <img class="mobile" src="/img/club/v-phone.jpg" alt="회원 앱: 다가오는 정모">
      <span class="label l2">운영진</span>
      <span class="label l1">회원 앱</span>
    </div>
  </section>


  <section class="values" id="values"></section>

  <section class="catalog" id="catalog">
    <details id="catalogBox">
      <summary><h2>모듈 · 요금제</h2><span class="open">펼치기</span></summary>
      <div id="catalogList"></div>
    </details>
  </section>

  <section class="cta">
    <div>
      <h2>우리 모임 이름으로 보고 싶다면</h2>
      <p>모임 이름·종목·모이는 요일을 적어 주시면 그 내용으로 바꾼 화면을 보내 드려요.</p>
    </div>
    <a class="btn" href="/system#contact">문의하기</a>
  </section>
</main>
<footer class="wrap">화면의 모임·회원·글은 모두 가상 데이터예요. 실제 납품 시 우리 모임 이름·색·공지로 바뀌고, 사진은 회원이 직접 올립니다.</footer>

<dialog id="zoom" aria-label="크게 보기">
  <button class="btn ghost close" type="button" id="zoomClose">닫기</button>
  <img id="zoomImg" alt="">
  <p id="zoomCap"></p>
</dialog>

<script>
// 모듈별 장면 — 맨 아래 "모듈 · 요금제"에 접어 둠. 이미지는 img/club/<id>.jpg
// 다시 찍기: appgongbang-engine scripts/club-demo-seed.py → club-demo-shots.py
const GROUPS = [
  { title: "추천 모듈 — 운영진이 매일 하던 일", modules: [
    { id: "join", rec: true, plan: "베이직부터", title: "가입 · 회원 관리", line: "가입 신청을 운영진이 수락하고, 회원 목록에서 관리", wide: false, scenes: [
      ["join-1", "처음 온 사람", "공지만 보이고 \"가입 신청\". 글·회원 목록은 회원에게만"],
      ["join-2", "운영진 화면", "가입 신청이 맨 위에 모임, 수락·거절 한 번"],
      ["join-3", "회원 목록", "승인제 / 바로 가입 전환, 운영진 표시, 내보내기"],
    ]},
    { id: "meet", rec: true, plan: "베이직부터", title: "정모 일정 · 참가 신청", line: "일정을 올리면 회원이 신청하고, 수락된 사람끼리 단체방이 열림", wide: false, scenes: [
      ["meet-1", "다가오는 정모", "날짜·장소·남은 자리·비용 방식"],
      ["meet-2", "회원이 신청", "정확한 장소는 참가자에게만 보임"],
      ["meet-3", "운영진이 수락", "신청자 수락·거절, 자리가 차면 \"자리 없음\""],
      ["meet-4", "참가자 단체방", "수락하면 그 정모 단체방에 자동으로 들어감"],
    ]},
    { id: "board", rec: true, plan: "베이직부터", title: "공지 · 게시판", line: "공지는 위에 고정, 회원 이야기는 아래에. 단톡방에 묻히지 않게", wide: false, scenes: [
      ["board-1", "공지 고정", "운영진 공지가 늘 맨 위"],
      ["board-2", "게시판", "회원 글, 최근 것부터"],
      ["board-3", "공지 올리기", "운영진은 \"공지\"를 켜고 올리면 끝"],
    ]},
  ]},
  { title: "다음 단계 — 돈과 출석까지", modules: [
    { id: "fee", plan: "스탠다드", soon: true, title: "회비 · 참가비", line: "입금 확인을 통장·엑셀로 하지 않게", steps: ["운영진이 회비·참가비 안내", "회원이 앱에서 카드·계좌로 결제(동호회 명의 PG)", "납부 현황표 — 누가 냈는지 자동으로"] },
    { id: "attend", plan: "옵션", soon: true, title: "출석 · 활동 기록", line: "정모 출석이 쌓여 우수 회원·장기 미참석 회원이 보이게", steps: ["정모 장소에서 QR 출석", "회원별 참석 횟수", "우수 회원 · 오래 안 나온 회원 목록"] },
  ]},
  { title: "기본 포함", modules: [
    { id: "admin", plan: "모든 패키지", title: "운영진 화면 · 동호회 꾸미기", line: "PC에서 이름·색·회원·신고·사용량을 한 곳에서", wide: true, scenes: [
      ["admin-1", "동호회 꾸미기", "이름·소개·첫 화면 문구·색"],
      ["admin-2", "회원 관리", "회원 목록, 문제 회원은 기간 정해 정지"],
      ["admin-3", "사용량", "달마다 활동 회원·정모·신청·게시글 수"],
    ]},
  ]},
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// 쌓이는 데이터 — 섹션마다 학원이 얻는 것 한 줄 + 그 데이터 화면(핵심 영역만 잘라 낸 v-*.jpg, 화면마다 이름 하나). more = 그 모듈 화면 전체.
const VALUES = [
  {"who": "처음 온 사람 → 운영진", "title": "가입은 신청 → 수락, 회원만 안을 봐요", "more": "join", "shots": [["st-a1", "처음 온 사람"], ["st-a3", "승인제 회원 목록"]]},
  {"who": "회원 폰", "title": "정모 인원이 앱에서 모이고, 단체방도 저절로", "more": "meet", "shots": [["st-b1", "정모 · 남은 자리"], ["st-b3", "참가 신청 수락"], ["st-b4", "참가자 단체방"]]},
  {"who": "회원 폰", "title": "공지가 단톡방에 묻히지 않게", "more": "board", "shots": [["st-c2", "늘 맨 위에 고정"], ["st-c1", "운영진은 올리기만"]]},
];
const MODS = Object.fromEntries(GROUPS.flatMap((g) => g.modules).map((m) => [m.id, m]));

document.getElementById("values").innerHTML = VALUES.map((v) => `
  <article class="value${v.phone ? " phone" : ""}">
    <div class="vtext">
      <span class="who">${esc(v.who)}</span>
      <h2>${esc(v.title)}</h2>
      <button class="more" type="button" data-more="${v.more}">화면 ${MODS[v.more].scenes.length + (MODS[v.more].wideScenes || []).length}장 더 →</button>
    </div>
    <div class="vshots${v.shots.filter((x) => !x[2]).length === 3 ? " n3" : ""}">
      ${v.shots.map(([img, label, span]) => `
        <button class="vshot${span ? " full" : ""}" type="button" data-img="${img}" data-cap="${esc(label)}" aria-label="${esc(label)} 크게 보기">
          <img src="/img/club/${img}.jpg" alt="${esc(label)}" loading="lazy"><span class="note top">${esc(label)}</span>
        </button>`).join("")}
    </div>
  </article>`).join("");

const sceneList = (list, cls) => `
  <div class="scenes${cls}">
    ${list.map(([img, cap, sub]) => `
      <figure class="scene">
        <button type="button" data-img="${img}" data-cap="${esc(cap)}" aria-label="${esc(cap)} 크게 보기"><img src="/img/club/${img}.jpg" alt="${esc(cap + ": " + sub)}" loading="lazy"><span class="note top">${esc(cap)}</span></button>
      </figure>`).join("")}
  </div>`;
// soon = 아직 없는 모듈(화면 없이 흐름만), wideScenes = 휴대폰 장면 뒤에 붙는 PC 장면
const scenesHtml = (m) => m.soon
  ? `<div class="soon">만들면 이렇게 돼요 — 화면은 준비 중<ol>${m.steps.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>`
  : sceneList(m.scenes, m.wide ? "" : " phone") + (m.wideScenes ? `<div style="margin-top:16px">${sceneList(m.wideScenes, "")}</div>` : "");

// 기능별 화면 전체 — 맨 아래에 접어 둠(모듈마다 열어야 화면)
document.getElementById("catalogList").innerHTML = GROUPS.map((g) => `
  <p class="gtitle">${esc(g.title)}</p>
  ${g.modules.map((m) => `
    <details class="mod" id="${m.id}">
      <summary>
        <div>
          <div class="tags">${m.rec ? '<span class="tag rec">추천</span>' : ""}<span class="tag">${esc(m.plan)}</span>${m.soon ? '<span class="tag soon-tag">준비 중</span>' : ""}</div>
          <h3>${esc(m.title)}</h3>
          <p>${esc(m.line)}</p>
        </div>
        <span class="open">${m.soon ? "흐름" : "화면"}</span>
      </summary>
      <div class="body">${scenesHtml(m)}<div class="foot"><a class="btn ghost" href="/system#contact">이 모듈 문의</a></div></div>
    </details>`).join("")}`).join("");

function openModule(id) {
  const d = document.getElementById(id);
  if (!d || !MODS[id]) return;
  document.getElementById("catalogBox").open = true;
  d.open = true;
  requestAnimationFrame(() => d.scrollIntoView({ behavior: "smooth", block: "start" }));
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-more]");
  if (b) openModule(b.dataset.more);
});
// 주소 #<모듈>로 오면 그 기능 화면을 열어 줌(사이트 다른 페이지 링크)
const openFromHash = () => openModule(location.hash.slice(1));
openFromHash();
window.addEventListener("hashchange", openFromHash);

const zoom = document.getElementById("zoom");
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-img]");
  if (!b) return;
  document.getElementById("zoomImg").src = `/img/club/${b.dataset.img}.jpg`;
  document.getElementById("zoomImg").alt = b.dataset.cap;
  document.getElementById("zoomCap").textContent = b.dataset.cap;
  zoom.showModal();
});
document.getElementById("zoomClose").onclick = () => zoom.close();
zoom.addEventListener("click", (e) => { if (e.target === zoom) zoom.close(); });
</script>
</body>
</html>
