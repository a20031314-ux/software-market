<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체대입시·유소년 스포츠 기록 모듈 — 앱공방</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#17120f; --surface:#221b16; --surface2:#2b221c; --line:#3b312a;
    --ink:#f4eee8; --muted:#ab9e92; --accent:#f08a4b; --accent-ink:#1d1410;
  }
  *{margin:0;box-sizing:border-box}
  body{background:var(--night);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
  a{color:inherit}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px}
  header{border-bottom:1px solid var(--line);background:rgba(23,18,15,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
  .logo{font-weight:800;text-decoration:none}.logo b{color:var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none;font-size:15px;min-height:44px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .hero{padding:44px 0 8px}
  .eyebrow{color:var(--muted);font-size:14px}
  h1{font-size:34px;letter-spacing:-1px;line-height:1.3;margin:6px 0 12px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px}
  nav.jump{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
  nav.jump a{text-decoration:none;font-size:14px;padding:7px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
  nav.jump a.rec{border-color:var(--accent);color:var(--accent)}
  .group{margin-top:56px}
  .group > h2{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:6px}
  .module{padding:28px 0 36px;border-top:1px solid var(--line)}
  .mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .mhead h3{font-size:26px;letter-spacing:-.6px;line-height:1.3}
  .mhead p{color:var(--muted);font-size:15px;margin-top:4px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface2);color:var(--muted)}
  .tag.rec{background:var(--accent);color:var(--accent-ink)}
  .scenes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,320px)),1fr))}
  .scenes.phone{--min:200px}
  .scene{margin:0;display:flex;flex-direction:column;gap:10px}
  .scene button{all:unset;cursor:zoom-in;display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
  .scene button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .scene img{display:block;width:100%;height:auto}
  .scenes.phone img{aspect-ratio:390/700;object-fit:contain;object-position:top;background:var(--surface)}
  .scene figcaption{font-size:14px;line-height:1.5}
  .scene figcaption b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);color:var(--accent);font-size:12px;margin-right:6px}
  .scene figcaption span{color:var(--muted)}
  .soon{border:1px dashed var(--line);border-radius:14px;padding:18px 20px;color:var(--muted);font-size:15px}
  .soon ol{margin:8px 0 0 18px;color:var(--ink)}
  .tag.soon-tag{background:transparent;border:1px dashed var(--line)}
  .cta{margin:64px 0 40px;padding:28px;border-radius:18px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .cta h2{font-size:22px}.cta p{color:var(--muted);font-size:15px}
  footer{color:var(--muted);font-size:13px;padding:0 0 40px}
  dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1440px);max-height:94vh}
  dialog::backdrop{background:rgba(10,8,6,.88)}
  dialog img{display:block;max-width:100%;max-height:88vh;border-radius:12px}
  dialog p{color:var(--ink);text-align:center;font-size:15px;margin-top:10px}
  dialog .close{position:fixed;top:14px;right:14px}
  @media (max-width:640px){h1{font-size:26px}.mhead h3{font-size:22px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/#system">앱<b>공방</b></a>
  <a class="btn" href="/#contact">문의하기</a>
</div></header>

<main class="wrap">
  <section class="hero">
    <p class="eyebrow">시스템 서비스 · 체대입시 · 유소년 스포츠 · 태권도</p>
    <h1>실기 기록 · 목표 점수 모듈</h1>
    <div class="pills">
      <span class="pill">가상 데이터로 찍은 실제 화면</span>
      <span class="pill">엑셀 대신 반 × 종목 표에 입력</span>
      <span class="pill">학부모는 로그인 없이 링크로</span>
    </div>
    <nav class="jump" aria-label="모듈" id="jump"></nav>
  </section>
  <div id="groups"></div>

  <section class="cta">
    <div>
      <h2>우리 종목·기준으로 보고 싶다면</h2>
      <p>측정 종목·반 구성·목표 기준(대학 배점표, 승급 기준)을 적어 주시면 그 내용으로 바꾼 화면을 보내 드려요.</p>
    </div>
    <a class="btn" href="/#contact">문의하기</a>
  </section>
</main>
<footer class="wrap">화면의 학원·학생·기록은 모두 가상 데이터이고, 기준표의 학교 이름과 점수도 실제가 아니에요. 실제 기준표는 학원이 학교별 모집요강을 보고 넣습니다.</footer>

<dialog id="zoom" aria-label="크게 보기">
  <button class="btn ghost close" type="button" id="zoomClose">닫기</button>
  <img id="zoomImg" alt="">
  <p id="zoomCap"></p>
</dialog>

<script>
// 모듈별 장면 — 그룹 순서 = 보여 주는 순서(추천 모듈부터). 이미지는 img/sports/<id>.jpg
// 장면 다시 찍기: dating 저장소 scripts/sports-demo-seed.py → scripts/sports-demo-shots.py (장면 이름이 같다)
// soon: 아직 없는 모듈 — 화면 대신 흐름만. wideScenes: 휴대폰 장면 뒤에 붙는 PC 장면.
const GROUPS = [
  { title: "추천 모듈 — 코치가 매주 하던 일", modules: [
    { id: "rec", rec: true, plan: "업종 패키지 포함", title: "실기 기록 · 추이", line: "측정한 날 표에 숫자만 넣으면 학생별 변화와 그래프가 자동으로", wide: true, scenes: [
      ["rec-1", "기록 입력", "반 × 종목 표, 회차를 고르고 바꾼 칸만 저장"],
      ["rec-2", "학생 카드", "목표 점수와 가장 많이 좋아진 종목"],
      ["rec-3", "종목별 추이 · 코치 한 줄", "좋아진 쪽이 늘 위로, 반 평균·목표 점선. 아래에서 학부모 링크 복사"],
    ]},
    { id: "goal", rec: true, plan: "업종 패키지 포함", title: "목표 대비 점수", line: "목표 대학 배점표·승급 기준으로 지금 몇 점인지, 어디에 집중할지", wide: true, scenes: [
      ["goal-1", "목표 점수", "종목별 점수, 다음 점수까지 남은 기록, 집중 종목 2개"],
      ["goal-2", "반 전체 표", "학생 × 종목 최근 기록, 반 평균보다 좋으면 강조"],
      ["goal-3", "기준표 넣기", "종목마다 \"기록 점수\" 줄을 붙여넣기"],
    ]},
    { id: "parent", rec: true, plan: "업종 패키지 포함", title: "학부모 리포트", line: "로그인 없이 링크 하나로. 다른 학생 이름은 보이지 않음", wide: false, scenes: [
      ["parent-1", "리포트 첫 화면", "코치 한 줄, 요약 문장, 목표 점수"],
      ["parent-2", "종목별 추이", "회차마다 기록, 반 평균과 목표 점선"],
    ]},
  ]},
  { title: "다음 단계 — 출석과 대회까지", modules: [
    { id: "attend", plan: "옵션", soon: true, title: "출결 · 공지", line: "결석을 바로 알고 학부모에게 알리게", steps: ["수업 장소 QR로 출석", "결석·지각이 자동으로 표시되고 알림", "공지는 학부모 리포트 링크와 같은 곳에"] },
    { id: "match", plan: "옵션", soon: true, title: "대회 운영", line: "학원·도장 자체 대회를 앱에서", steps: ["참가 신청 받기", "대진표·조 편성", "결과 입력 → 순위표 자동"] },
  ]},
  { title: "기본 포함", modules: [
    { id: "manage", plan: "모든 패키지", title: "반 · 학생 · 종목 관리", line: "명단은 붙여넣기 한 번, 종목은 학원이 직접 정함", wide: true, scenes: [
      ["manage-1", "반 카드", "학생 수, 기록한 학생, 종목별 반 평균"],
      ["manage-2", "명단", "\"이름, 반\" 붙여넣기 → 반 생성, 학생 계정·전화번호 받지 않음"],
      ["manage-3", "종목", "단위·클수록/작을수록 좋음·소수 자리"],
    ]},
  ]},
];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
document.getElementById("jump").innerHTML = GROUPS.flatMap((g) => g.modules).map((m) => `<a href="#${m.id}"${m.rec ? ' class="rec"' : ""}>${esc(m.title)}</a>`).join("");
document.getElementById("groups").innerHTML = GROUPS.map((g) => `
  <section class="group">
    <h2>${esc(g.title)}</h2>
    ${g.modules.map((m) => `
      <article class="module" id="${m.id}">
        <div class="mhead">
          <div>
            <div class="tags">${m.rec ? '<span class="tag rec">추천</span>' : ""}<span class="tag">${esc(m.plan)}</span>${m.soon ? '<span class="tag soon-tag">준비 중</span>' : ""}</div>
            <h3>${esc(m.title)}</h3>
            <p>${esc(m.line)}</p>
          </div>
          <a class="btn ghost" href="/#contact">이 모듈 문의</a>
        </div>
        ${m.soon ? `<div class="soon">만들면 이렇게 돼요 — 화면은 준비 중<ol>${m.steps.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>` : `<div class="scenes${m.wide ? "" : " phone"}">
          ${m.scenes.map(([img, cap, sub], i) => `
            <figure class="scene">
              <button type="button" data-img="${img}" data-cap="${esc(cap + " — " + sub)}" aria-label="${esc(cap)} 크게 보기"><img src="/img/sports/${img}.jpg" alt="${esc(cap + ": " + sub)}" loading="lazy"></button>
              <figcaption><b>${i + 1}</b>${esc(cap)}<br><span>${esc(sub)}</span></figcaption>
            </figure>`).join("")}
        </div>${m.wideScenes ? `<div class="scenes" style="margin-top:16px">${m.wideScenes.map(([img, cap, sub], i) => `
            <figure class="scene">
              <button type="button" data-img="${img}" data-cap="${esc(cap + " — " + sub)}" aria-label="${esc(cap)} 크게 보기"><img src="/img/sports/${img}.jpg" alt="${esc(cap + ": " + sub)}" loading="lazy"></button>
              <figcaption><b>${m.scenes.length + i + 1}</b>${esc(cap)}<br><span>${esc(sub)}</span></figcaption>
            </figure>`).join("")}</div>` : ""}`}
      </article>`).join("")}
  </section>`).join("");

const zoom = document.getElementById("zoom");
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-img]");
  if (!b) return;
  document.getElementById("zoomImg").src = `/img/sports/${b.dataset.img}.jpg`;
  document.getElementById("zoomImg").alt = b.dataset.cap;
  document.getElementById("zoomCap").textContent = b.dataset.cap;
  zoom.showModal();
});
document.getElementById("zoomClose").onclick = () => zoom.close();
zoom.addEventListener("click", (e) => { if (e.target === zoom) zoom.close(); });
</script>
</body>
</html>
